
[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum        = { version = "0.8.9", features = ["ws"] }
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1.52.3", features = ["full"] }
rand        = "0.8"
tower-http  = { version = "0.6", features = ["cors"] }
