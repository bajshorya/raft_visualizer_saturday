version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    networks:
      - raft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/command"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001/ws
      - NEXT_PUBLIC_HTTP_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - raft-network

networks:
  raft-network:
    driver: bridge
